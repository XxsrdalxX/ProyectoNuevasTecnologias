<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Juego - GameReview</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        .detalle-hero {
            position: relative;
            width: 100%;
            height: 340px;
            overflow: hidden;
            border-radius: 1rem;
            margin-bottom: 2rem;
        }
        .detalle-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.45);
        }
        .detalle-hero-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            display: flex;
            align-items: flex-end;
            gap: 1.5rem;
        }
        .detalle-cover {
            width: 120px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            border: 3px solid #7c3aed;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .detalle-titulo-bloque h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin: 0 0 0.4rem;
        }
        .detalle-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }
        .meta-badge {
            background: rgba(124,58,237,0.7);
            color: #e9d5ff;
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-weight: 600;
        }
        .rating-grande {
            background: #7c3aed;
            color: #fff;
            font-size: 1.4rem;
            font-weight: 800;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .info-card {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            border: 1px solid #2d2d4e;
        }
        .info-card .label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }
        .info-card .valor {
            font-size: 1rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .descripcion-box {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 1.25rem;
            border: 1px solid #2d2d4e;
            color: #d1d5db;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        /* Reseñas */
        .resenas-titulo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #c4b5fd;
            margin-bottom: 1rem;
            border-left: 4px solid #7c3aed;
            padding-left: 0.75rem;
        }
        .resena-card {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            border: 1px solid #2d2d4e;
            margin-bottom: 0.75rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }
        .resena-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7c3aed;
            flex-shrink: 0;
        }
        .resena-avatar-placeholder {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #4c1d95;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c4b5fd;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
            border: 2px solid #7c3aed;
        }
        .resena-body { flex: 1; }
        .resena-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }
        .resena-username { font-weight: 700; color: #e2e8f0; font-size: 0.95rem; }
        .resena-score {
            background: #7c3aed;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.1rem 0.45rem;
            border-radius: 6px;
        }
        .resena-fecha { font-size: 0.75rem; color: #6b7280; margin-left: auto; }
        .resena-comentario { color: #d1d5db; font-size: 0.9rem; line-height: 1.5; }

        /* Formulario nueva reseña */
        .form-resena {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 1.25rem;
            border: 1px solid #4c1d95;
            margin-bottom: 1.5rem;
        }
        .form-resena h3 { color: #c4b5fd; margin: 0 0 1rem; font-size: 1.1rem; }
        .form-resena textarea {
            width: 100%;
            background: #0d0e1b;
            border: 1px solid #3f3d56;
            border-radius: 6px;
            color: #e2e8f0;
            padding: 0.6rem 0.75rem;
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 80px;
            box-sizing: border-box;
        }
        .form-resena input[type="number"] {
            width: 80px;
            background: #0d0e1b;
            border: 1px solid #3f3d56;
            border-radius: 6px;
            color: #e2e8f0;
            padding: 0.4rem 0.6rem;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .form-row { display: flex; gap: 1rem; align-items: center; margin-top: 0.75rem; flex-wrap: wrap; }
        .form-label { color: #9ca3af; font-size: 0.85rem; }
        .login-prompt { color: #9ca3af; font-size: 0.9rem; }
        .login-prompt a { color: #a78bfa; text-decoration: underline; }

        .nav-right { display: flex; align-items: center; gap: 0.75rem; }
        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
        }
        .btn-volver:hover { color: #c4b5fd; }
        #msgResena { min-height: 1.2rem; font-size: 0.85rem; font-weight: 600; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="logo">GameReview</a>
                <ul class="nav-menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="consolas.html">Consolas</a></li>
                    <li><a href="resenas.html">Reseñas</a></li>
                </ul>
                <div class="nav-right">
                    <div id="nav-auth" style="display:flex;align-items:center;gap:0.75rem;"></div>
                </div>
            </div>
        </nav>
    </header>

    <main style="max-width:900px;margin:2rem auto;padding:0 1rem;">
        <button class="btn-volver" onclick="history.back()">&#8592; Volver</button>

        <div id="contenido">
            <p style="color:#9ca3af;">Cargando juego...</p>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <h3 class="logo">GameReview</h3>
                <p style="color:#9ca3af;">Tu portal gamer definitivo.</p>
            </div>
            <div class="footer-links">
                <ul>
                    <li>Sobre nosotros</li>
                    <li>Contacto</li>
                    <li>Términos</li>
                </ul>
            </div>
        </div>
    </footer>

    <script src="auth-nav.js"></script>
    <script>
    const API_BASE = 'http://localhost:8080';

    function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    function authHeaders() {
        const token = localStorage.getItem('gr_token');
        return token ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                     : { 'Content-Type': 'application/json' };
    }

    function usuarioActual() {
        try { return JSON.parse(localStorage.getItem('gr_user')); } catch { return null; }
    }

    function puedeModificar(duenioId) {
        const u = usuarioActual();
        return u && (u.idUsuario === duenioId || u.rol === 'admin');
    }

    function inicialFallback(nombre) {
        return (nombre || '?').charAt(0).toUpperCase();
    }

    function renderAvatar(usuario) {
        if (usuario.avatar) {
            return `<img class="resena-avatar" src="${usuario.avatar}"
                        alt="${usuario.username}"
                        onerror="this.outerHTML='<div class=\\'resena-avatar-placeholder\\'>${inicialFallback(usuario.username)}</div>'">`;
        }
        return `<div class="resena-avatar-placeholder">${inicialFallback(usuario.username)}</div>`;
    }

    function renderResena(r) {
        const u = r.usuario || {};
        const fecha = r.fechaResena ? new Date(r.fechaResena).toLocaleDateString('es-ES', { year:'numeric', month:'short', day:'numeric' }) : '';
        const puedeBorrar = puedeModificar(u.idUsuario);
        return `
            <div class="resena-card" id="resena-${r.idResena}">
                ${renderAvatar(u)}
                <div class="resena-body">
                    <div class="resena-header">
                        <span class="resena-username">${u.username || 'Usuario'}</span>
                        <span class="resena-score">★ ${r.puntuacion}/10</span>
                        <span class="resena-fecha">${fecha}</span>
                        ${puedeBorrar ? `<button onclick="borrarResena(${r.idResena})" style="margin-left:0.5rem;background:none;border:none;color:#f87171;cursor:pointer;font-size:0.8rem;">Eliminar</button>` : ''}
                    </div>
                    <p class="resena-comentario">${r.comentario || '<em style="color:#6b7280;">Sin comentario</em>'}</p>
                </div>
            </div>`;
    }

    async function borrarResena(idResena) {
        if (!confirm('¿Eliminar esta reseña?')) return;
        const res = await fetch(`${API_BASE}/api/resenas/${idResena}`, {
            method: 'DELETE',
            headers: authHeaders()
        });
        if (res.status === 204) {
            document.getElementById(`resena-${idResena}`)?.remove();
        } else {
            alert('No se pudo eliminar la reseña.');
        }
    }

    async function cargar() {
        const id = getParam('id');
        if (!id) {
            document.getElementById('contenido').innerHTML = '<p style="color:#f87171;">ID de juego no especificado.</p>';
            return;
        }

        const [resJuego, resResenas] = await Promise.all([
            fetch(`${API_BASE}/api/juegos/${id}`),
            fetch(`${API_BASE}/api/resenas/juego/${id}`)
        ]);

        if (!resJuego.ok) {
            document.getElementById('contenido').innerHTML = '<p style="color:#f87171;">Juego no encontrado.</p>';
            return;
        }

        const juego = await resJuego.json();
        const resenas = resJuego.ok && resResenas.ok ? await resResenas.json() : [];

        document.title = `${juego.titulo} - GameReview`;

        const calif = juego.calificacionProm != null ? Number(juego.calificacionProm).toFixed(1) : 'N/A';
        const precio = juego.precio != null ? `$${Number(juego.precio).toFixed(2)}` : 'Precio N/A';
        const imagen = juego.urlImagen || juego.urlimagen || `https://placehold.co/900x340/1f1f3a/7c3aed?text=${encodeURIComponent(juego.titulo)}`;
        const fecha = juego.fechaLanzamiento ? new Date(juego.fechaLanzamiento).toLocaleDateString('es-ES', { year:'numeric', month:'long', day:'numeric' }) : 'N/A';

        const u = usuarioActual();
        const formulario = u ? `
            <div class="form-resena">
                <h3>Escribir una reseña</h3>
                <textarea id="comentarioInput" placeholder="Comparte tu opinión sobre este juego..."></textarea>
                <div class="form-row">
                    <span class="form-label">Puntuación (1-10):</span>
                    <input type="number" id="puntuacionInput" min="1" max="10" value="8">
                    <button class="btn-primary" onclick="enviarResena(${juego.idJuego})">Publicar reseña</button>
                </div>
                <div id="msgResena"></div>
            </div>` : `
            <div class="form-resena">
                <p class="login-prompt">
                    <a href="login.html">Inicia sesión</a> para escribir una reseña.
                </p>
            </div>`;

        document.getElementById('contenido').innerHTML = `
            <div class="detalle-hero">
                <img src="${imagen}" alt="${juego.titulo}"
                     onerror="this.src='https://placehold.co/900x340/1f1f3a/7c3aed?text=${encodeURIComponent(juego.titulo)}'">
                <div class="detalle-hero-content">
                    <img class="detalle-cover" src="${imagen}" alt="${juego.titulo}"
                         onerror="this.src='https://placehold.co/120x160/1f1f3a/7c3aed?text=Cover'">
                    <div class="detalle-titulo-bloque">
                        <h1>${juego.titulo}</h1>
                        <div class="detalle-meta">
                            <span class="rating-grande">★ ${calif}</span>
                            <span class="meta-badge">${juego.genero?.nombre || 'N/A'}</span>
                            <span class="meta-badge">${juego.plataforma?.nombre || 'N/A'}</span>
                            <span class="meta-badge">${precio}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-card">
                    <div class="label">Estudio</div>
                    <div class="valor">${juego.estudio?.nombre || 'N/A'}</div>
                </div>
                <div class="info-card">
                    <div class="label">Plataforma</div>
                    <div class="valor">${juego.plataforma?.nombre || 'N/A'}</div>
                </div>
                <div class="info-card">
                    <div class="label">Género</div>
                    <div class="valor">${juego.genero?.nombre || 'N/A'}</div>
                </div>
                <div class="info-card">
                    <div class="label">Lanzamiento</div>
                    <div class="valor">${fecha}</div>
                </div>
            </div>

            <div class="descripcion-box">${juego.descripcion || 'Sin descripción disponible.'}</div>

            <h2 class="resenas-titulo">Reseñas (${resenas.length})</h2>

            ${formulario}

            <div id="lista-resenas">
                ${resenas.length > 0
                    ? resenas.map(renderResena).join('')
                    : '<p style="color:#6b7280;font-style:italic;">Aún no hay reseñas. ¡Sé el primero!</p>'}
            </div>
        `;
    }

    async function enviarResena(juegoId) {
        const comentario = document.getElementById('comentarioInput').value.trim();
        const puntuacion = parseInt(document.getElementById('puntuacionInput').value);
        const msg = document.getElementById('msgResena');

        if (!puntuacion || puntuacion < 1 || puntuacion > 10) {
            msg.style.color = '#f87171';
            msg.textContent = 'La puntuación debe ser entre 1 y 10.';
            return;
        }

        const res = await fetch(`${API_BASE}/api/resenas`, {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ juegoId, comentario, puntuacion })
        });

        const data = await res.json();

        if (res.status === 201) {
            msg.style.color = '#34d399';
            msg.textContent = 'Reseña publicada.';
            document.getElementById('comentarioInput').value = '';
            document.getElementById('puntuacionInput').value = '8';

            const lista = document.getElementById('lista-resenas');
            const sinResenas = lista.querySelector('p');
            if (sinResenas) sinResenas.remove();
            lista.insertAdjacentHTML('afterbegin', renderResena(data));
            setTimeout(() => { msg.textContent = ''; }, 2000);
        } else {
            msg.style.color = '#f87171';
            msg.textContent = data.error || 'Error al publicar la reseña.';
        }
    }

    document.addEventListener('DOMContentLoaded', cargar);
    </script>
</body>
</html>
